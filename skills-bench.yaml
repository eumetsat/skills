# Repository conventions checked by `skills-bench validate .` (see docs/validation.md).
version: 1
skills_dir: skills
required_skills: [eumdac, ewccli, firecube, esf-satellite-data, feature-db-client, ml-menu-cdr]
frontmatter:
  allowed_keys: [name, description, license, compatibility, metadata]   # the agentskills.io specification's fields, nothing client-specific
  description_max_chars: 1024
budgets:
  skill_md_max_lines: 500
  skill_md_max_tokens: 5000
  frontmatter_max_tokens: 250
require:
  openai_yaml: true
  references_dir: true
references:
  eumdac: [install.md, auth.md, datastore-discovery.md, datastore-filtering.md, datastore-download.md, datastore-metalink.md, python-api.md, tailor-orders.md, subscriptions-livefeed.md, troubleshooting.md]
  ewccli: [install.md, auth-profiles.md, hub.md, infra.md, vm-images.md, vm-plans.md, custom-catalogues.md, official-links.md, troubleshooting.md]
  firecube: [install.md, cli-surface.md, configuration-storage.md, ingestion.md, plugin-development.md, plugin-traps.md, templates.md, parallelism.md, benchmarks.md, zarr-parquet-archive.md, chunks-catalog.md, performance.md, troubleshooting.md]
  esf-satellite-data: [workflow.md, parameters-to-iterate.md, mcp-tools.md, data-sources.md, destinations-and-credentials.md, streaming-and-stac.md, zarr-store-template.md, download-script-template.md, error-cases.md]
  feature-db-client: [querying.md, saving-features.md, reference-data-and-errors.md]
  ml-menu-cdr: [records.md, troubleshooting.md, python-template.md]
cli_checks:
  # Resolved on PATH (a repo-relative path is tried first); every check is skipped when the tool is absent,
  # so a fresh clone or CI without the tools still validates. Install the CLIs to make the checks run.
  - name: eumdac
    command: ["eumdac", "--help"]
    skip_if_absent: true
    expect_contains: [set-credentials, token, describe, search, download, download-metalink, subscribe, subs, livefeed, tailor, local-tailor, order]
  - name: ewc
    command: ["ewc", "--help"]
    skip_if_absent: true
    expect_contains: [login, version, hub, infra]
  - name: ewc-hub
    command: ["ewc", "hub", "--help"]
    skip_if_absent: true
    expect_contains: [list, show, deploy]
  - name: firecube
    command: ["firecube", "--help"]
    skip_if_absent: true
    expect_contains: [ingest, archive, zarr, parquet, chunks, catalog, plugins, advise, completion]
  - name: firecube-plugins
    command: ["firecube", "plugins", "--help"]
    skip_if_absent: true
    expect_contains: [create, describe, explain, install, list, uninstall]
